server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: eventify-pro

  # Gizli değerler proje kökündeki .env dosyasından okunur (git'e girmez, bkz. .env.example)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventify_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  # @Cacheable sonuçları Redis'te tutulur, 10 dakika sonra silinir
  cache:
    type: redis
    redis:
      time-to-live: 10m

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 1 Gün (milisaniye cinsinden)
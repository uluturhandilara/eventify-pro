version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventify_postgres
    environment:
      POSTGRES_DB: eventify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventify-net

  redis:
    image: redis:7-alpine
    container_name: eventify_redis
    ports:
      - "6379:6379"
    networks:
      - eventify-net

volumes:
  postgres_data:

networks:
  eventify-net:
    driver: bridge
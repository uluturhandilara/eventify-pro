services:
  postgres:
    image: postgres:15-alpine
    container_name: eventify_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventify-net
    # Uygulama, Postgres bağlantı kabul etmeye başlayana kadar bekler (bkz. app.depends_on)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventify_redis
    ports:
      - "6379:6379"
    networks:
      - eventify-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: eventify-pro:latest
    container_name: eventify_app
    # JWT_SECRET, DB_USERNAME, DB_PASSWORD vb. .env dosyasından gelir
    env_file:
      - .env
    # Container içinde "localhost" uygulamanın kendisidir; DB ve Redis'e servis adlarıyla bağlanılır.
    # Buradaki değerler .env'dekileri ezer, böylece .env IntelliJ'den çalıştırmak için localhost'ta kalabilir.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventify-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  eventify-net:
    driver: bridge

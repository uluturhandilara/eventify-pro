# Üretim ortamında frontend'i sunan ve API isteklerini backend'e yönlendiren Nginx ayarı.
# Geliştirmede aynı işi vite.config.ts'teki proxy yapar.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # /api/... → backend container'ı. "app" ismi docker-compose'daki servis adıdır.
    # Yol aynen iletilir: /api/v1/events → http://app:8080/api/v1/events
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hash'li asset dosyaları uzun süre cache'lenebilir (içerik değişince adı da değişir)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /events/5 gibi yollar sunucuda dosya değil → index.html'e düş, React Router halleder
    location / {
        try_files $uri $uri/ /index.html;
    }
}
